name: CI
on:
  pull_request:
    types: [opened, synchronize, reopened] # these are the defaults - synchronize means 'commits pushed to PR'
  push:
    branches: [master]
    # The merge result is checked whole, and the caches its jobs save are the ones the next
    # pull requests restore: a pull request can read entries saved on its own branch and on
    # its base, nothing else.

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  golang-ci:
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: cccteam/github-workflows/.github/workflows/golang-ci.yml@ce3b6a61c4b88c82d3c0c1760dc1a3f5a2731021 # v8.2.3
    with:
      golangci-lint-version: 'v2.12.2'
      # insecurecookie is the development configuration for Chrome, alone and together
      # with skipAuth; every configuration a developer runs is one CI tests.
      build-tags: '["", "skipAuth", "insecurecookie", "skipAuth,insecurecookie"]'
      # The untagged test leg measures coverage and writes the per-package table to the job
      # summary; generated mocks are left out, they are never executed and would dilute the figures.
      coverage: true
      coverage-exclude: '/mock'

  semantic-titles:
    permissions:
      pull-requests: read
    uses: cccteam/github-workflows/.github/workflows/semantic-pull-request-title.yml@ce3b6a61c4b88c82d3c0c1760dc1a3f5a2731021 # v8.2.3
