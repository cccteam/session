version: "2"
linters:
  default: none
  enable:
    - asciicheck
    - bodyclose
    - copyloopvar
    - cyclop
    - depguard
    - dogsled
    - durationcheck
    - errcheck
    - errorlint
    - exhaustive
    - forcetypeassert
    - funlen
    - gochecknoinits
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - godox
    - gomoddirectives
    - goprintffuncname
    - gosec
    - govet
    - importas
    - ineffassign
    - lll
    - makezero
    - misspell
    - nakedret
    - nestif
    - nilerr
    - nlreturn
    - noctx
    - nolintlint
    - paralleltest
    - prealloc
    - predeclared
    - revive
    - rowserrcheck
    - sqlclosecheck
    - staticcheck
    - tagliatelle
    - tparallel
    - unconvert
    - unparam
    - wastedassign
    - whitespace
    - wrapcheck
  settings:
    cyclop:
      max-complexity: 25
    depguard:
      rules:
        main:
          files:
            - $all
          allow:
            - aidanwoods.dev/go-paseto
            - cloud.google.com/go/spanner
            - github.com/cccteam
            - github.com/coreos/go-oidc/v3
            - github.com/georgysavva/scany/v2
            - github.com/go-chi/chi/v5
            - github.com/go-jose/go-jose/v4
            - github.com/go-playground/errors/v5
            - github.com/gofrs/uuid
            - github.com/google/go-cmp
            - github.com/gorilla/securecookie
            - github.com/jackc/pgerrcode
            - github.com/jackc/pgx/v5
            - go.opentelemetry.io/otel
            - go.opentelemetry.io/otel/attribute
            - go.opentelemetry.io/otel/sdk/trace
            - go.opentelemetry.io/otel/sdk/trace/tracetest
            - go.opentelemetry.io/otel/trace
            - go.uber.org/mock
            - golang.org/x/crypto/hkdf
            - golang.org/x/oauth2
            - google.golang.org/api/admin/directory/v1
            - google.golang.org/api/iterator
            - google.golang.org/api/option
            - google.golang.org/grpc/codes
            - $gostd
    dupl:
      threshold: 100
    exhaustive:
      default-signifies-exhaustive: true
    funlen:
      lines: 100
      statements: 50
    gocognit:
      min-complexity: 50
    goconst:
      min-len: 2
      min-occurrences: 3
    gocritic:
      enabled-tags:
        - diagnostic
        - experimental
        - opinionated
        - performance
        - style
    gocyclo:
      min-complexity: 25
    godox:
      keywords:
        - TODO
        - BUG
    lll:
      line-length: 200
    misspell:
      locale: US
    nestif:
      min-complexity: 10
    tagliatelle:
      case:
        rules:
          json: camel
        use-field-name: true
    wrapcheck:
      ignore-sigs:
        - .Errorf(
        - errors.New(
        - errors.Unwrap(
        - .Wrap(
        - .Wrapf(
        - .WithMessage(
        - .WithMessagef(
        - .Cause(
  exclusions:
    generated: lax
    presets:
      - common-false-positives
      - std-error-handling
    rules:
      - linters:
          - funlen
          - gochecknoglobals
          - gochecknoinits
          - goconst
          - gocyclo
          - lll
          - mnd
          - nlreturn
          - scopelint
        path: _test\.go
      # drivertest is test code shared by the driver packages; it gets the test-file
      # allowances even though it cannot be a _test.go file.
      - linters:
          - funlen
          - gochecknoglobals
          - gochecknoinits
          - goconst
          - gocyclo
          - lll
          - mnd
          - nlreturn
          - scopelint
        path: sessionstorage/internal/drivertest/|internal/oidctest/
      - linters:
          - tagliatelle
        path: oidc_azure\.go|internal/azureoidc/azureoidc(_skipAuth)?(_test)?\.go
        text: preferred_username
      - linters:
          - tagliatelle
        path: internal/googleoidc/googleoidc(_skipAuth)?(_test)?\.go
        text: email_verified
      # G124 only accepts literal secure attribute values. These cookie writers take
      # HttpOnly/SameSite from the caller by design, and Secure is switched by the
      # insecurecookie build tag via SecureCookie().
      - linters:
          - gosec
        path: cookie/cookie\.go
        text: G124
      # gosec's taint analysis cannot see that every redirect target here is either
      # constrained to a local path by internalcookie.SanitizeReturnURL or is the
      # OIDC provider's authorization URL built from server-side configuration.
      - linters:
          - gosec
        path: oidc_azure\.go|oidc_google\.go|internal/basesession/basesession\.go
        text: G710
      - linters:
          - gomoddirectives
        path: go\.mod
        text: replacement are not allowed
      - linters:
          - revive
        text: avoid meaningless package names
      - linters:
          - revive
        path: internal/cookie/cookie_iface\.go
        text: CookieHandler by other packages, and that stutters
      - linters:
          - revive
        path: internal/cookie/cookie\.go
        text: CookieClient by other packages, and that stutters
      - linters:
          - gocognit
        path: sessionstorage/internal/spanner/spanner_test\.go
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
    - gofumpt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
